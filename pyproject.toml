[tool.poetry]
name = "rex-tendon"
version = "0.1.0"
description = "A high-performance robotics simulation and RL training library for the Rex-Tendon tentacle robot."
authors = ["Abhijith <abhijithpr17@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "rex_tendon"}]

[tool.poetry.dependencies]
python = "^3.12"
numpy = "<2.0"
scipy = "^1.13.0"
mujoco = ">=3.1.5"
gymnasium = ">=0.29.1"
stable-baselines3 = ">=2.3.2"
torch = ">=2.2.0"
torchvision = ">=0.17.0"
opencv-python = ">=4.9.0"
ultralytics = ">=8.2.0"
mediapipe = ">=0.10.11"
albumentations = ">=1.4.0"
pydantic = ">=2.6.4"
pydantic-settings = ">=2.2.1"
pyyaml = ">=6.0.1"
typer = ">=0.12.0"
rich = ">=13.7.0"
websockets = ">=12.0"
sounddevice = ">=0.4.6"
SpeechRecognition = ">=3.10.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.1.1"
pytest-cov = ">=5.0.0"
black = ">=24.3.0"
isort = ">=5.13.2"
mypy = ">=1.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
rex-tendon = "rex_tendon.__main__:main"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Coverage flags removed: pytest-cov is not installed in the project venv and
# the flags made every bare `pytest` invocation fail. Re-add after
# `poetry add --group dev pytest-cov` (post-training-run).
addopts = "-ra -q --strict-markers"
