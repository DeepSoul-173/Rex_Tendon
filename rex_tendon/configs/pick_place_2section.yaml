# Stage B FOUNDATION: 4-DOF (2-section) arm learns plain pick-and-place first.
# Stacking from scratch on an untrained 4-DOF arm diverges (policy std blew up to
# 8e4 because the easy proximity-grasp needs no precision, so entropy regularisation
# wins). This config trains the SAME proven Stage A recipe (single -> multi place at
# a fixed zone) on the 2-section scene to produce a competent, low-variance 4-DOF
# policy. pick_place_stack.yaml then WARM-STARTS from this model.
pick_place:
  env:
    xml_file: "rex_assets/rex_simulation/pick_and_place_scene_2section.xml"
    # 4-DOF arm tendons are 0.06-0.17; start near rest (slightly slack).
    initial_actuator_position: [0.13, 0.17]
    simulation_length_seconds: 12.0

    # Object-count curriculum 1 -> 3 (bumps when place_success > 90%). Start at 1
    # to validate the 4-DOF pick-place pipeline cleanly, like Stage A did.
    object_curriculum_enabled: true
    min_spawned_objects: 1
    max_spawned_objects: 3
    num_spawned_objects: 3

    # The 4-DOF arm reaches the table (z~0.01), so a near-contact grasp is feasible
    # (unlike the 1-section arm). Snap the cube to the fingertip on grasp.
    grasp_distance_threshold: 0.035
    grasp_consecutive_steps: 2
    grasp_carry_offset: 0.015
    place_distance_threshold: 0.06

    # Reach/grasp phase transfers fast; enter placing early.
    curriculum_enabled: true
    reach_only_steps: 0
    reach_grasp_steps: 100000

    # Non-farmable reward (Stage A recipe): reach + grasp bonus + progress-to-zone
    # + place bonus + living cost; no per-step lift reward.
    reach_reward_scale: 1.0
    grasp_bonus: 5.0
    object_progress_reward_scale: 1.0
    transport_reward_scale: 0.0
    place_bonus: 25.0
    drop_penalty: 3.0
    time_penalty: 0.05

    randomize_dynamics: true
    add_observation_noise: true
    action_smoothing_alpha: 0.45
    max_action_delta_per_step: 0.25

  training:
    num_envs: 12
    total_timesteps: 6000000
    eval_freq: 40000
    save_freq: 200000
    learning_rate: 0.0003
    n_steps: 1024
    batch_size: 256
    ent_coef: 0.01
    log_dir_base: "rex_results/pick_place_2section"

  active_task: place
  tasks:
    place:
      name: place
      randomize_object_position: true
