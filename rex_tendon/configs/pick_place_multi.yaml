# Multi-object curriculum: ramp spawned objects 2 -> 5, promoting when place
# success > 90% at the current count. Logs per-object-count metrics for the
# generalization curve. Run with: `pick-place train-multi` (optionally
# --init-model <single-object best_model.zip> to warm-start).
pick_place:
  env:
    # --- object-count curriculum ---
    object_curriculum_enabled: true
    min_spawned_objects: 2
    max_spawned_objects: 5
    occlusion_radius: 0.05

    # --- grasp (hybrid: contact OR proximity) ---
    grasp_distance_threshold: 0.06
    grasp_consecutive_steps: 2
    place_distance_threshold: 0.10

    # --- curriculum phases: enter the placing phase early (grasp is solved) ---
    curriculum_enabled: true
    reach_only_steps: 0
    reach_grasp_steps: 50000

    # --- reward (the single-object-validated shaping: no farmable lift level) ---
    reach_reward_scale: 1.0
    grasp_bonus: 5.0
    object_progress_reward_scale: 3.0
    transport_reward_scale: 0.0
    place_bonus: 25.0
    drop_penalty: 3.0
    time_penalty: 0.05

    # --- regularisers ---
    randomize_dynamics: true
    add_observation_noise: true
    action_smoothing_alpha: 0.45
    max_action_delta_per_step: 0.25

  training:
    num_envs: 12
    total_timesteps: 8000000   # 5-10 M to ramp 2 -> 5 over a 1-2 day run
    eval_freq: 20000
    save_freq: 100000
    learning_rate: 0.0003
    n_steps: 1024
    batch_size: 256
    log_dir_base: "rex_results/pick_place_multi"

  # Pick a randomly-spawned object each reset (count set by the curriculum).
  active_task: task1
  tasks:
    task1:
      name: task1
      active_object_index: 0
      randomize_object_position: true
